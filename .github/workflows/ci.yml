name: CI

# push 에서는 시크릿을 주입해 build(테스트 포함)를, PR 에서는 시크릿 없이 컴파일만 돌린다.
# PR 에 build 를 그대로 붙일 수는 없다 — contextLoads 가 실제 DB/Redis 를 요구해 시크릿 치환이
# 필요한데, Dependabot PR 에는 GitHub 이 시크릿을 내려주지 않아 항상 실패한다. 정작 검증이 가장
# 필요한 것이 의존성 상향 PR 이므로, 시크릿 없이도 도는 컴파일을 PR 게이트로 둔다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    # PR 에서는 아래 compile 잡이 대신 돈다 (시크릿 의존 때문)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set application.yml values
        uses: microsoft/variable-substitution@6287962da9e5b6e68778dc51e840caa03ca84495 # v1
        with:
          files: src/main/resources/application.yml
        env:
          spring.security.user.name: ${{ secrets.SECURITY_USER_NAME }}
          spring.security.user.password: ${{ secrets.SECURITY_USER_PASSWORD }}
          spring.datasource.url: ${{ secrets.DB_URL }}
          spring.datasource.username: ${{ secrets.DB_USERNAME }}
          spring.datasource.password: ${{ secrets.DB_PASSWORD }}
          application.jwt.secretKey: ${{ secrets.JWT_SECRET_KEY }}
          spring.mail.port: ${{ secrets.SMTP_PORT }}
          spring.mail.email_noreply: ${{ secrets.SMTP_EMAIL_NOREPLY }}
          spring.mail.password_noreply: ${{ secrets.SMTP_PASSWORD_NOREPLY }}
          spring.mail.email_recruit: ${{ secrets.SMTP_EMAIL_RECRUIT }}
          spring.mail.password_recruit: ${{ secrets.SMTP_PASSWORD_RECRUIT }}
          spring.data.redis.host: ${{ secrets.REDIS_HOST }}
          spring.data.redis.port: ${{ secrets.REDIS_PORT }}
          spring.data.redis.password: ${{ secrets.REDIS_PASSWORD }}
          application.webauthn.rpId: ${{ secrets.WEBAUTHN_RP_ID }}
          application.webauthn.rpName: ${{ secrets.WEBAUTHN_RP_NAME }}
          application.webauthn.allowedOrigins: ${{ secrets.WEBAUTHN_ALLOWED_ORIGINS }}
          slack.webhook-url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create GCP Service Account Key File
        run: |
          mkdir -p src/main/resources
          echo '${{ secrets.GCP_SERVICE_KEY }}' > src/main/resources/bigtablet-homepage-ffe77aff799f.json

      - name: chmod gradlew
        run: chmod +x ./gradlew

      - name: Build and test with Gradle
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace build

  # PR 게이트 — 시크릿을 쓰지 않으므로 Dependabot PR 에서도 그대로 돈다.
  # 머지 전에 "적어도 컴파일은 된다" 를 보장하는 것이 목적이다. 지금은 이 검증이 없어 의존성
  # 상향 PR 이 컴파일 가능 여부도 모른 채 머지되고, main/develop 에 들어간 뒤에야 build 가 돈다.
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: chmod gradlew
        run: chmod +x ./gradlew

      # application.yml 의 시크릿 자리표시자는 컴파일에 관여하지 않으므로 치환 없이 수행한다.
      # 테스트는 포함하지 않는다 — contextLoads 가 실제 인프라를 요구해 여기서는 돌 수 없다.
      - name: Compile with Gradle
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace compileJava compileTestJava